# ============================================
# GitHub Actions - AI资讯自动抓取 + 部署
# 功能：每天自动运行 fetch_news.py 抓取最新数据，
#       然后通过 GitHub Pages 自动部署网站
# ============================================

name: AI News Fetch & Deploy

# ── 触发条件 ──────────────────────────────
on:
  # 每天 UTC 00:00（北京时间 08:00）自动运行
  schedule:
    - cron: '0 0 * * *'
  # 也支持手动触发（在仓库 Actions 页面点 Run workflow）
  workflow_dispatch:

# ── 权限 ───────────────────────────────────
permissions:
  contents: write
  pages: write
  id-token: write

# ── 环境变量 ───────────────────────────────
env:
  PYTHONUTF8: 1

jobs:
  # ════════════════════════════════════════
  # 任务1：抓取数据并生成 data.js
  # ════════════════════════════════════════
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: pip install -r requirements.txt

      - name: 🕷️ 运行抓取脚本
        run: python fetch_news.py
        env:
          PYTHONUTF8: 1

      - name: ✅ 检查输出文件
        run: |
          echo "=== data.js 前20行 ==="
          head -20 js/data.js
          echo ""
          echo "=== 文件大小 ==="
          ls -lh js/data.js

      - name: 💾 提交数据更新（如有变更）
        run: |
          git config --local user.email "action[bot]@github.com"
          git config --local user.name "GitHub Actions"
          git add js/data.js
          if ! git diff --cached --quiet; then
            git commit -m "🤖 [auto] 更新AI资讯数据 $(date '+%Y-%m-%d %H:%M')"
            echo "has_changes=true" >> $GITHUB_ENV
          else
            echo "没有新数据变更，跳过提交"
            echo "has_changes=false" >> $GITHUB_ENV
          fi

      - name: 🚀 推送到主分支
        if: env.has_changes == 'true'
        run: git push

  # ════════════════════════════════════════
  # 任务2：部署到 GitHub Pages
  # 数据更新后自动部署网站
  # ════════════════════════════════════════
  deploy-pages:
    needs: fetch-news
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 配置 Pages
        uses: actions/configure-pages@v4

      - name: 📤 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
